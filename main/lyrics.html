<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #ffffff;
            color: #333;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-app-region: drag;
        }

        .header {
            padding: 12px 14px 8px;
            border-bottom: 1px solid #f0f0f0;
            flex-shrink: 0;
            -webkit-app-region: drag;
        }

        .track-name {
            font-size: 12px;
            font-weight: 600;
            color: #222;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-name {
            font-size: 10px;
            color: #888;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .close-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 20px;
            height: 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            color: #aaa;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            -webkit-app-region: no-drag;
            transition: all 0.15s;
        }

        .close-btn:hover {
            background: #f5f5f5;
            color: #666;
        }

        .lyrics-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            -webkit-app-region: no-drag;
        }

        .lyrics-container::-webkit-scrollbar {
            width: 4px;
        }

        .lyrics-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .lyrics-container::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 2px;
        }

        .lyrics-line {
            font-size: 12px;
            line-height: 1.8;
            color: #444;
        }

        .lyrics-line.empty {
            height: 16px;
        }

        .no-lyrics {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 8px;
            color: #bbb;
        }

        .no-lyrics .icon {
            font-size: 28px;
            opacity: 0.5;
        }

        .no-lyrics .text {
            font-size: 11px;
        }

        .label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4ecca3;
            font-weight: 600;
            margin-bottom: 4px;
        }
    </style>
</head>

<body>
    <div class="header" style="position: relative;">
        <div class="label">♪ Lyrics</div>
        <div class="track-name" id="trackName">---</div>
        <div class="artist-name" id="artistName">---</div>
        <button class="close-btn" id="closeBtn" title="Close">✕</button>
    </div>
    <div class="lyrics-container" id="lyricsContainer">
        <div class="no-lyrics">
            <div class="icon">♪</div>
            <div class="text">No lyrics available</div>
        </div>
    </div>
    <script>
        document.getElementById("closeBtn").addEventListener("click", () => {
            window.lyricsAPI.close();
        });

        window.lyricsAPI.onUpdate(({ lyrics, trackName, artistName }) => {
            document.getElementById("trackName").textContent = trackName || "---";
            document.getElementById("artistName").textContent = artistName || "---";
            const container = document.getElementById("lyricsContainer");

            if (!lyrics || lyrics.trim() === "") {
                container.innerHTML = '<div class="no-lyrics"><div class="icon">♪</div><div class="text">No lyrics available</div></div>';
                return;
            }

            const lines = lyrics.split("\n");
            container.innerHTML = lines.map(line =>
                line.trim() === ""
                    ? '<div class="lyrics-line empty"></div>'
                    : '<div class="lyrics-line">' + escapeHtml(line) + '</div>'
            ).join("");
            container.scrollTop = 0;
        });

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>

</html>
